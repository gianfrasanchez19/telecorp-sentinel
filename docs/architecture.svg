<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Arial, Helvetica, sans-serif">
  <title>TeleCorp Sentinel — Arquitectura de la solución</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c5221f"/></marker>
    <style>
      .t{font-size:13px;fill:#1a1a1a;font-weight:bold}
      .s{font-size:11px;fill:#444}
      .xs{font-size:10px;fill:#555}
      .lbl{font-size:10.5px;fill:#333}
      .node{fill:#fff;stroke:#c9c8c1;stroke-width:1.2}
      .aws{fill:#fff8ef;stroke:#ff9900;stroke-width:2}
      .gcp{fill:#eef4fe;stroke:#1a73e8;stroke-width:2}
      .sfn{fill:#fdf1f7;stroke:#c2185b;stroke-width:1.5}
      .data{fill:#eaf7ee;stroke:#1e8e3e;stroke-width:1.4}
      .sec{fill:#fdecec;stroke:#c5221f;stroke-width:1.4}
      .q{fill:#fff3e0;stroke:#e8710a;stroke-width:1.2}
      .st{fill:#fff;stroke:#c2185b;stroke-width:1}
      .ch{fill:#fff;stroke:#c2185b;stroke-width:1}
      .e{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ed{stroke:#333;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .eb{stroke:#1a73e8;stroke-width:1.8;fill:none;marker-end:url(#ab)}
      .er{stroke:#c5221f;stroke-width:1.3;fill:none;stroke-dasharray:4 3;marker-end:url(#ar)}
      .num{fill:#1a1a1a}
      .numt{fill:#fff;font-size:11px;font-weight:bold}
    </style>
  </defs>
  <rect width="1600" height="1060" fill="#ffffff"/>

  <!-- Título -->
  <text x="24" y="38" font-size="24" font-weight="bold" fill="#111">TeleCorp Sentinel — Arquitectura de la solución</text>
  <text x="24" y="60" font-size="13" fill="#444">100 % serverless · AWS (núcleo: API, persistencia, eventos, Step Functions, seguridad) + Google Cloud (IA: Cloud Run + Vertex AI Gemini) · Hackathon Cloud Computing UTEC 2026-2 · Grupo 60</text>

  <!-- Actores -->
  <g>
    <rect x="20" y="120" width="150" height="56" rx="28" class="node"/><text x="95" y="144" text-anchor="middle" class="t">Ciudadano</text><text x="95" y="160" text-anchor="middle" class="xs">portal público (reporta)</text>
    <rect x="20" y="200" width="150" height="56" rx="28" class="node"/><text x="95" y="224" text-anchor="middle" class="t">Operador NOC</text><text x="95" y="240" text-anchor="middle" class="xs">consola (JWT)</text>
    <rect x="20" y="280" width="150" height="56" rx="28" class="node"/><text x="95" y="304" text-anchor="middle" class="t">Dispositivos</text><text x="95" y="320" text-anchor="middle" class="xs">POST /telemetry (JWT)</text>
    <rect x="20" y="760" width="150" height="56" rx="28" class="node"/><text x="95" y="784" text-anchor="middle" class="t">Buzón ciudadano</text><text x="95" y="800" text-anchor="middle" class="xs">aviso con consentimiento</text>
  </g>

  <!-- AWS -->
  <rect x="200" y="84" width="980" height="900" rx="14" class="aws"/>
  <text x="218" y="108" font-size="15" font-weight="bold" fill="#b35c00">AWS · us-east-1 · cuenta AWS Academy (rol LabRole) · Serverless Framework v4 / CloudFormation</text>

  <!-- Fila A: borde / API / seguridad -->
  <rect x="230" y="124" width="180" height="70" rx="8" class="node"/><text x="320" y="146" text-anchor="middle" class="t">CloudFront + S3</text><text x="320" y="163" text-anchor="middle" class="s">S3 privado · OAC · HTTPS</text><text x="320" y="179" text-anchor="middle" class="s">SPA React (portal + consola)</text>
  <rect x="450" y="124" width="190" height="70" rx="8" class="node"/><text x="545" y="146" text-anchor="middle" class="t">API Gateway HTTP API</text><text x="545" y="163" text-anchor="middle" class="s">rutas validadas · CORS restringido</text><text x="545" y="179" text-anchor="middle" class="s">throttling 50 rps / ráfaga 100</text>
  <rect x="680" y="124" width="180" height="70" rx="8" class="sec"/><text x="770" y="146" text-anchor="middle" class="t">Lambda Authorizer</text><text x="770" y="163" text-anchor="middle" class="s">JWT HS256 · rol OPERADOR/INGESTA</text><text x="770" y="179" text-anchor="middle" class="s">(Cognito no disponible en Academy)</text>
  <rect x="900" y="124" width="250" height="70" rx="8" class="sec"/><text x="1025" y="146" text-anchor="middle" class="t">AWS Secrets Manager</text><text x="1025" y="163" text-anchor="middle" class="s">clave maestra generada por AWS → HKDF:</text><text x="1025" y="179" text-anchor="middle" class="s">JWT · HMAC seudónimos · AES-GCM PII · tokens</text>

  <!-- Fila B: lambdas API + DynamoDB -->
  <rect x="450" y="234" width="190" height="78" rx="8" class="node"/><text x="545" y="256" text-anchor="middle" class="t">Lambdas API (Node 22)</text><text x="545" y="273" text-anchor="middle" class="s">public · operator · ingest</text><text x="545" y="289" text-anchor="middle" class="s">zod · idempotencia · rate limit</text><text x="545" y="304" text-anchor="middle" class="s">logs JSON sin PII</text>
  <rect x="680" y="234" width="470" height="78" rx="8" class="data"/><text x="915" y="256" text-anchor="middle" class="t">Amazon DynamoDB — tabla única on-demand</text><text x="915" y="273" text-anchor="middle" class="s">réplica en 3 zonas de disponibilidad · PITR · cifrado SSE · 2 GSI · TTL sólo temporales</text><text x="915" y="289" text-anchor="middle" class="s">reportes · PII cifrada aparte · métricas · episodios · incidentes · historial inmutable</text><text x="915" y="304" text-anchor="middle" class="s">bloqueo lógico INCKEY (1 incidente activo/clave) · contadores atómicos · outbox</text>

  <!-- Fila C: outbox → colas (derecha a izquierda) -->
  <rect x="980" y="352" width="170" height="58" rx="8" class="data"/><text x="1065" y="375" text-anchor="middle" class="t">DynamoDB Streams</text><text x="1065" y="392" text-anchor="middle" class="s">INSERT OUTBOX# / NOTIF#</text>
  <rect x="760" y="352" width="180" height="58" rx="8" class="node"/><text x="850" y="375" text-anchor="middle" class="t">λ streamPublisher</text><text x="850" y="392" text-anchor="middle" class="s">outbox → SQS · bisect · DLQ</text>
  <rect x="520" y="352" width="200" height="58" rx="8" class="q"/><text x="620" y="375" text-anchor="middle" class="t">SQS eventos</text><text x="620" y="392" text-anchor="middle" class="s">SSE · visibilidad 180 s · DLQ×5</text>
  <rect x="230" y="352" width="250" height="58" rx="8" class="node"/><text x="355" y="375" text-anchor="middle" class="t">λ eventsConsumer</text><text x="355" y="392" text-anchor="middle" class="s">telemetría en línea · StartExecution evt-&lt;id&gt;</text>
  <rect x="520" y="420" width="200" height="26" rx="6" class="q"/><text x="620" y="438" text-anchor="middle" class="xs">DLQ eventos → alarma CloudWatch</text>

  <!-- Step Functions -->
  <rect x="230" y="470" width="920" height="232" rx="10" class="sfn"/>
  <text x="246" y="492" font-size="14" font-weight="bold" fill="#880e4f">AWS Step Functions Standard — incident-workflow (Choice · Retry exponencial · Catch · Map)</text>
  <g font-size="11">
    <rect x="248" y="508" width="96" height="40" rx="6" class="st"/><text x="296" y="532" text-anchor="middle" class="lbl">LoadEvent</text>
    <polygon points="404,508 444,528 404,548 364,528" class="ch"/><text x="404" y="532" text-anchor="middle" class="xs">Tipo</text>
    <rect x="464" y="508" width="150" height="40" rx="6" class="st"/><text x="539" y="524" text-anchor="middle" class="lbl">ValidateAndCorrelate</text><text x="539" y="539" text-anchor="middle" class="xs">≥10 usuarios distintos &lt;24 h</text>
    <polygon points="674,508 714,528 674,548 634,528" class="ch"/><text x="674" y="532" text-anchor="middle" class="xs">¿cambio?</text>
    <rect x="734" y="508" width="170" height="40" rx="6" class="st"/><text x="819" y="524" text-anchor="middle" class="lbl">PersistIncidentAndHistory</text><text x="819" y="539" text-anchor="middle" class="xs">lock + CAS · Retry conflicto</text>
    <rect x="924" y="508" width="130" height="40" rx="6" class="st"/><text x="989" y="524" text-anchor="middle" class="lbl">CalculatePriority</text><text x="989" y="539" text-anchor="middle" class="xs">determinista</text>
    <polygon points="1100,508 1140,528 1100,548 1060,528" class="ch"/><text x="1100" y="532" text-anchor="middle" class="xs">¿IA?</text>

    <rect x="760" y="580" width="250" height="56" rx="6" class="st" stroke-dasharray="5 3"/><text x="885" y="598" text-anchor="middle" class="lbl">Map · AnalyzeWithGCP (Retry ×2)</text><text x="885" y="614" text-anchor="middle" class="xs">Catch → BuildFallbackAnalysis (AI_UNAVAILABLE)</text><text x="885" y="628" text-anchor="middle" class="xs">→ PersistAnalysis (caché por hash)</text>
    <rect x="480" y="588" width="170" height="40" rx="6" class="st"/><text x="565" y="604" text-anchor="middle" class="lbl">QueueNotifications</text><text x="565" y="619" text-anchor="middle" class="xs">NOTIF# deduplicadas</text>
    <rect x="248" y="588" width="140" height="40" rx="6" class="st"/><text x="318" y="613" text-anchor="middle" class="lbl">MarkSucceeded ✓</text>
    <rect x="248" y="648" width="140" height="40" rx="6" class="st"/><text x="318" y="664" text-anchor="middle" class="lbl">PropagateStatus</text><text x="318" y="679" text-anchor="middle" class="xs">estado → reportes</text>
    <rect x="480" y="648" width="250" height="40" rx="6" class="st" stroke="#c5221f"/><text x="605" y="664" text-anchor="middle" class="lbl">Catch → MarkFailed → Fail</text><text x="605" y="679" text-anchor="middle" class="xs">PROC FALLIDO · alarma · replay específico</text>
  </g>
  <g class="e" stroke-width="1.2">
    <path d="M344,528 H362"/><path d="M444,528 H462"/><path d="M614,528 H632"/><path d="M714,528 H732"/><path d="M904,528 H922"/><path d="M1054,528 H1058"/>
    <path d="M1100,548 V566 H885 V578"/>
    <path d="M760,608 H652"/>
    <path d="M480,608 H390"/>
    <path d="M404,548 V560 H238 V668 H246" stroke-dasharray="4 3"/>
    <path d="M388,668 H440 V618 H478" stroke-dasharray="4 3"/>
    <path d="M674,548 V570 H565 V586" stroke-dasharray="4 3"/>
  </g>
  <text x="650" y="563" class="xs">no</text><text x="1095" y="561" text-anchor="end" class="xs">sí: apertura o cambio material</text><text x="246" y="577" class="xs">INCIDENT_STATUS_CHANGED</text>

  <!-- Notificaciones -->
  <rect x="230" y="734" width="190" height="58" rx="8" class="q"/><text x="325" y="757" text-anchor="middle" class="t">SQS notificaciones</text><text x="325" y="774" text-anchor="middle" class="s">DLQ×4 · reintentos</text>
  <rect x="460" y="734" width="230" height="58" rx="8" class="node"/><text x="575" y="757" text-anchor="middle" class="t">λ notificationsConsumer</text><text x="575" y="774" text-anchor="middle" class="s">dedup · INCIERTA si se pierde respuesta</text>
  <rect x="730" y="734" width="200" height="58" rx="8" class="node"/><text x="830" y="757" text-anchor="middle" class="t">Amazon SES (correo)</text><text x="830" y="774" text-anchor="middle" class="s">sandbox: destinatarios verificados</text>
  <rect x="970" y="734" width="180" height="58" rx="8" class="node" stroke-dasharray="5 3"/><text x="1060" y="757" text-anchor="middle" class="t">Amazon SNS SMS</text><text x="1060" y="774" text-anchor="middle" class="s">opcional (si la cuenta lo permite)</text>

  <!-- Programados y observabilidad -->
  <rect x="230" y="824" width="250" height="70" rx="8" class="node"/><text x="355" y="846" text-anchor="middle" class="t">Amazon EventBridge</text><text x="355" y="863" text-anchor="middle" class="s">λ simulator cada 1 min (apagable)</text><text x="355" y="879" text-anchor="middle" class="s">λ outboxReconciler cada 5 min</text>
  <rect x="520" y="824" width="410" height="70" rx="8" class="node"/><text x="725" y="846" text-anchor="middle" class="t">Amazon CloudWatch</text><text x="725" y="863" text-anchor="middle" class="s">logs JSON {tipo, log_datos} 14 d · Logs Insights · X-Ray</text><text x="725" y="879" text-anchor="middle" class="s">alarmas: DLQ, errores, API p95 &gt; 2 s, ExecutionsFailed</text>
  <rect x="970" y="824" width="180" height="70" rx="8" class="node"/><text x="1060" y="852" text-anchor="middle" class="t">SNS alertas</text><text x="1060" y="869" text-anchor="middle" class="s">correo del equipo</text>
  <text x="218" y="966" class="xs">IaC: backend/serverless.yml + infra/aws/*.yml (validada con cfn-lint) · sin EC2 ni clústeres · DynamoDB on-demand + Lambda + SQS + Step Functions escalan a cero en reposo</text>

  <!-- GCP -->
  <rect x="1210" y="350" width="370" height="420" rx="14" class="gcp"/>
  <text x="1228" y="374" font-size="15" font-weight="bold" fill="#174ea6">Google Cloud · us-central1</text>
  <rect x="1236" y="392" width="318" height="92" rx="8" class="node"/><text x="1395" y="414" text-anchor="middle" class="t">Workload Identity Federation (AWS)</text><text x="1395" y="431" text-anchor="middle" class="s">Google STS valida GetCallerIdentity firmado (SigV4)</text><text x="1395" y="447" text-anchor="middle" class="s">condición: assumed-role/LabRole de la cuenta</text><text x="1395" y="463" text-anchor="middle" class="s">IAM Credentials → ID token del SA invocador</text><text x="1395" y="478" text-anchor="middle" class="xs">sin claves de cuenta de servicio</text>
  <rect x="1236" y="514" width="318" height="92" rx="8" class="node"/><text x="1395" y="536" text-anchor="middle" class="t">Cloud Run PRIVADO (FastAPI)</text><text x="1395" y="553" text-anchor="middle" class="s">--no-allow-unauthenticated · min 0 / max 2</text><text x="1395" y="569" text-anchor="middle" class="s">verifica invocador · redacta PII · valida JSON</text><text x="1395" y="585" text-anchor="middle" class="s">alternativa HMAC + anti-replay (Secret Manager)</text>
  <rect x="1236" y="636" width="318" height="92" rx="8" class="node"/><text x="1395" y="658" text-anchor="middle" class="t">Vertex AI · Gemini</text><text x="1395" y="675" text-anchor="middle" class="s">modelo configurable (verificado por región)</text><text x="1395" y="691" text-anchor="middle" class="s">entrada anonimizada · descripciones = datos</text><text x="1395" y="707" text-anchor="middle" class="s">no confiables · salida: resumen, causas,</text><text x="1395" y="722" text-anchor="middle" class="xs">acciones, incertidumbres (la IA no decide)</text>

  <!-- Flechas principales -->
  <path class="e" d="M170,148 H228"/>
  <path class="e" d="M170,228 H200 V160 H228"/>
  <path class="e" d="M410,159 H448"/><text x="414" y="152" class="xs">SPA→API</text>
  <path class="e" d="M170,308 H440 V196"/>
  <path class="e" d="M640,150 H678"/>
  <path class="ed" d="M860,150 H898"/>
  <path class="e" d="M545,194 V232"/>
  <path class="e" d="M640,273 H678"/><text x="642" y="266" class="xs">Transact</text>
  <path class="ed" d="M640,250 H660 V200 H990 V196" />
  <path class="e" d="M1065,312 V350"/>
  <path class="e" d="M980,381 H942"/>
  <path class="e" d="M760,381 H722"/>
  <path class="e" d="M520,381 H482"/>
  <path class="ed" d="M620,410 V418"/>
  <path class="e" d="M300,410 V468"/><text x="306" y="452" class="xs">StartExecution (nombre determinista)</text>
  <path class="ed" d="M1150,540 H1166 V300 H1152"/><text x="1173" y="470" class="xs" transform="rotate(-90 1173 470)">lee/escribe</text>
  <path class="ed" d="M850,410 V458 H120 V730 H228"/><text x="124" y="726" class="xs">NOTIF#</text>
  <path class="e" d="M420,763 H458"/>
  <path class="e" d="M690,763 H728"/>
  <path class="ed" d="M930,763 H968"/>
  <path class="e" d="M830,792 V803 H172"/>
  <path class="ed" d="M230,850 H212 V292 H448"/><text x="224" y="440" class="xs" transform="rotate(-90 224 440)">ingesta simulada</text>
  <path class="ed" d="M930,858 H968"/>
  <!-- AWS → GCP -->
  <path class="eb" d="M1010,600 H1190 V438 H1234"/><text x="1030" y="594" font-size="10.5" fill="#1a73e8" font-weight="bold">① WIF: subject token SigV4</text>
  <path class="eb" d="M1010,622 H1200 V560 H1234"/><text x="1030" y="636" font-size="10.5" fill="#1a73e8" font-weight="bold">② HTTPS + Bearer ID token</text>
  <path class="eb" d="M1395,606 V634"/>

  <!-- Leyenda -->
  <rect x="200" y="996" width="1380" height="54" rx="8" fill="#f7f7f5" stroke="#ddd"/>
  <text x="216" y="1016" font-size="11.5" fill="#222"><tspan font-weight="bold">Flujo:</tspan> reporte o métrica → API → TransactWrite durable (registro + outbox + idempotencia) → Streams → SQS → Step Functions (correlación, incidente único, prioridad, IA en GCP, notificaciones) → SES.</text>
  <text x="216" y="1036" font-size="11.5" fill="#222"><tspan font-weight="bold">Leyenda:</tspan> línea continua = síncrono · discontinua = asíncrono/evento · azul = llamada entre nubes AWS→GCP · rojo = seguridad. Datos sintéticos; alta disponibilidad Multi-AZ de servicios gestionados en una región (sin réplica multirregión).</text>
</svg>
