# Condiciones CloudFormation (incluidas desde backend/serverless.yml)
UsePitr: !Equals ['${param:pitr}', 'true']
UseScheduler: !Equals ['${param:scheduleKind}', 'scheduler']
UseEventRule: !Not [!Equals ['${param:scheduleKind}', 'scheduler']]
SimulatorOn: !Equals ['${param:simulatorEnabled}', 'true']
HasAlertEmail: !Not [!Equals ['${param:alertEmail}', '']]
DeployFrontend: !Equals ['${param:frontendMode}', 'cloudfront']
UseS3Website: !Equals ['${param:frontendMode}', 's3website']
HasNotifySubscriber: !Not [!Equals ['${param:notifyEmailSubscriber}', '']]
TracingOn: !Equals ['${param:tracing}', 'true']
